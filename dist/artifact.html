<title>Mahjong Night</title>
<style>:root {
  --bg: #0f3d2e; --bg2: #145039; --felt: radial-gradient(ellipse at 50% 35%, #1b6a4b 0%, #0f3d2e 75%);
  --ink: #f6f1e4; --muted: #b9cbbf; --panel: rgba(0,0,0,.28); --panel2: rgba(0,0,0,.45);
  --accent: #f4b63f; --accent2: #e8566c; --good: #4fd18b; --bad: #ff6b6b;
  --edge1: #e6d7ae; --edge2: #1f6b4a; --tw: 46px; --mini: 24px; --radius: 14px;
  --font: 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
body.theme-dotd {
  --bg: #1a0d1f; --bg2: #2a1233;
  --felt: radial-gradient(ellipse at 50% 30%, #3b1546 0%, #1a0d1f 70%);
  --accent: #ff9a1f; --accent2: #ff4fa3; --edge1: #ff9a1f; --edge2: #e83e98; --muted: #d6b9dd;
}
[hidden] { display: none !important; }
:root { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
body { background: var(--felt); background-attachment: fixed; overscroll-behavior: none; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 10px 16px; background: var(--accent); color: #2b1d00; font-weight: 700; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: default; }
button.ghost { background: rgba(255,255,255,.12); color: var(--ink); }
button.danger { background: var(--accent2); color: #fff; }
button.small { padding: 6px 10px; font-size: 14px; border-radius: 9px; }
button.big { padding: 14px 20px; font-size: 18px; width: 100%; }
input, select, textarea { font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); color: var(--ink); max-width: 100%; }
textarea { width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 14px; }
a { color: var(--accent); }
h1, h2, h3 { margin: .3em 0; }
.app { max-width: 1100px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* ---------- tiles ---------- */
.tile { position: relative; width: var(--tw); aspect-ratio: 3 / 4; border-radius: calc(var(--tw) * .14); flex: 0 0 auto;
  box-shadow: 0 2px 0 var(--edge1), 0 5px 0 var(--edge2), 0 7px 8px rgba(0,0,0,.35); transition: transform .12s; user-select: none; }
.tile svg { width: 100%; height: 100%; display: block; }
.tile.mini { --tw: var(--mini); box-shadow: 0 1px 0 var(--edge1), 0 2px 0 var(--edge2); }
.tile.sel { transform: translateY(-22%); }
.tile.sel::after { content: ''; position: absolute; inset: -3px; border: 3px solid var(--accent); border-radius: inherit; }
.tile.hint::before { content: ''; position: absolute; inset: -4px; border-radius: inherit; box-shadow: 0 0 0 3px #7cf, 0 0 14px #7cf; animation: pulse 1.2s infinite; }
.tile.new { animation: pop .5s; }
.tile.new::after { content: 'new'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 10px; background: var(--good); color: #032; border-radius: 6px; padding: 0 4px; font-weight: 700; }
.tile.recv::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: -10px; height: 4px; border-radius: 3px; background: var(--good); }
.tile.joker-off { opacity: .55; }
.tile.last { box-shadow: 0 0 0 3px var(--accent), 0 0 14px var(--accent); }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes pop { from { transform: scale(.6); } to { transform: none; } }

/* ---------- home ---------- */
.home { padding: 18px 16px 40px; max-width: 520px; margin: 0 auto; width: 100%; }
.logo { text-align: center; margin: 8px 0 18px; }
.logo .row { display: flex; justify-content: center; gap: 6px; --tw: 44px; margin-bottom: 12px; }
.logo .row .tile:nth-child(odd) { transform: rotate(-6deg); } .logo .row .tile:nth-child(even) { transform: rotate(5deg) translateY(4px); }
.logo h1 { font-size: 30px; letter-spacing: .5px; }
.logo p { color: var(--muted); margin: 0; }
.card-box { background: var(--panel); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
.card-box h3 { margin-top: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > * { flex: 1 1 auto; }
.seg { display: flex; background: rgba(0,0,0,.3); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; background: transparent; color: var(--ink); padding: 8px 6px; font-size: 14px; }
.seg button.on { background: var(--accent); color: #2b1d00; }
.muted { color: var(--muted); font-size: 14px; }
.code-in { text-transform: uppercase; letter-spacing: 4px; font-size: 22px; width: 8em; text-align: center; }

/* ---------- game ---------- */
.topbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel2); position: sticky; top: 0; z-index: 5; }
.topbar .info { flex: 1; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.2; }
.topbar .info b { color: var(--ink); }
.icon { background: rgba(255,255,255,.1); color: var(--ink); padding: 7px 9px; border-radius: 10px; font-size: 17px; line-height: 1; position: relative; }
.icon .dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); }
.table { flex: 1; display: grid; grid-template-columns: 1fr; gap: 6px; padding: 6px; }
.opps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.opps.two { grid-template-columns: 1fr; }
.opp { background: var(--panel); border-radius: 12px; padding: 6px; min-height: 64px; position: relative; border: 2px solid transparent; }
.opp.turn { border-color: var(--accent); box-shadow: 0 0 12px rgba(244,182,63,.4); }
.opp .nm { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opp .sub { font-size: 11px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,.15); font-weight: 700; }
.badge.dead { background: var(--bad); color: #fff; } .badge.ok { background: var(--good); color: #032; } .badge.wind { background: var(--accent); color: #2b1d00; }
.exps { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.exp { display: flex; gap: 1px; padding: 2px; border-radius: 6px; background: rgba(255,255,255,.08); }
.backs { display: flex; gap: 1px; margin-top: 3px; flex-wrap: wrap; }
.backs .tile { --tw: 9px; box-shadow: none; border-radius: 2px; }
.bubble { position: absolute; top: -10px; right: 6px; font-size: 26px; animation: floaty 2.6s forwards; pointer-events: none; z-index: 3; }
@keyframes floaty { 0% { transform: scale(.3); opacity: 0; } 15% { transform: scale(1.2); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-24px); opacity: 0; } }
.center { background: rgba(0,0,0,.18); border-radius: 12px; padding: 6px; min-height: 120px; display: flex; flex-direction: column; gap: 6px; }
.status { text-align: center; font-size: 15px; min-height: 22px; }
.status b { color: var(--accent); }
.pool { display: flex; flex-wrap: wrap; gap: 3px 3px; align-content: flex-start; max-height: 32vh; overflow-y: auto; padding: 4px 2px 6px; }
.claim { background: var(--panel2); border: 2px solid var(--accent); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.claim .what { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.claim .what .tile { --tw: 40px; }
.timer { width: 100%; height: 6px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--accent); transform-origin: left; animation: shrink linear forwards; }
@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.me { background: var(--panel); border-radius: 14px; padding: 8px 6px; border: 2px solid transparent; }
.me.turn { border-color: var(--accent); }
.me .head { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 4px; flex-wrap: wrap; }
.hand { display: flex; flex-wrap: wrap; gap: 9px 4px; justify-content: center; padding: 18px 2px 10px; min-height: 80px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px 4px 2px; }
.prompt { text-align: center; font-size: 15px; padding: 2px 4px 4px; }
.prompt b { color: var(--accent); }
@media (max-width: 640px) {
  :root { --tw: min(48px, calc((100vw - 72px) / 7)); --mini: min(22px, calc((100vw - 40px) / 15)); }
  .opp .exps .tile.mini { --mini: 15px; }
}
@media (min-width: 900px) {
  :root { --tw: 60px; --mini: 28px; }
  .table { grid-template-columns: 200px 1fr 200px; grid-template-areas: "l a r" "l c r" "m m m"; }
  .opps { display: contents; }
  .opp.pos-3 { grid-area: l; } .opp.pos-2 { grid-area: a; } .opp.pos-1 { grid-area: r; }
  .opps.two .opp { grid-area: a; }
  .center { grid-area: c; } .me { grid-area: m; }
  .hand { flex-wrap: nowrap; }
}

/* ---------- sheets & modals ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg2); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 14px 14px 28px; box-shadow: 0 -8px 30px rgba(0,0,0,.5); }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
.sheet .x { float: right; }
.cat { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
.hrow { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 10px; background: rgba(0,0,0,.2); margin: 4px 0; }
.hrow .pat { flex: 1; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 800; font-size: 15px; letter-spacing: .5px; background: #fbf7ec; padding: 4px 8px; border-radius: 6px; color: #333; word-spacing: 6px; }
.hrow .val { font-weight: 700; min-width: 48px; text-align: right; font-size: 13px; }
.hrow .note { font-size: 12px; color: var(--muted); }
.hrow.close { outline: 2px solid var(--good); }
.need { font-size: 11px; padding: 2px 6px; border-radius: 8px; background: rgba(255,255,255,.15); white-space: nowrap; }
.need.n0 { background: var(--good); color: #032; }
.pat .n { color: #333; } .pat .w { color: #333; }
.result-tiles { display: flex; flex-wrap: wrap; gap: 3px; margin: 8px 0; }
.scores { width: 100%; border-collapse: collapse; margin: 8px 0; }
.scores td, .scores th { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,.12); text-align: left; font-size: 14px; }
.scores .pos { color: var(--good); } .scores .neg { color: var(--bad); }
.chatlog { max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.chatlog .m { background: rgba(0,0,0,.25); border-radius: 10px; padding: 6px 9px; font-size: 14px; }
.chatlog .m b { color: var(--accent); }
.chatlog .sys { color: var(--muted); font-style: italic; }
.emojis { display: flex; flex-wrap: wrap; gap: 4px; }
.emojis button { background: rgba(255,255,255,.1); font-size: 22px; padding: 6px 8px; }
.log { font-size: 13px; color: var(--muted); max-height: 30vh; overflow-y: auto; }
.log div { padding: 2px 0; border-bottom: 1px dashed rgba(255,255,255,.08); }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #111c; color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 50; max-width: 92vw; font-size: 14px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.banner { background: var(--accent2); color: #fff; text-align: center; padding: 6px; font-size: 14px; }
.theme-pick { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.theme-pick button { background: rgba(0,0,0,.3); color: var(--ink); padding: 10px; border: 2px solid transparent; }
.theme-pick button.on { border-color: var(--accent); }
.theme-pick .row { display: flex; gap: 2px; justify-content: center; margin-bottom: 6px; --tw: min(30px, calc((50vw - 50px) / 5)); }
.slide { min-height: 220px; }
.slide .row { display: flex; gap: 4px; flex-wrap: wrap; margin: 10px 0; --tw: 36px; }
.ed-hand { background: rgba(0,0,0,.22); border-radius: 12px; padding: 10px; margin: 8px 0; }
.ed-hand .grid { display: grid; grid-template-columns: minmax(0,1fr) 80px; gap: 6px; }
.ed-hand .grid.two { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.ed-hand input:not([type=checkbox]) { width: 100%; min-width: 0; }
.ed-hand input.pattern { font-family: ui-monospace, Menlo, monospace; font-weight: 700; width: 100%; }
.ed-hand .err { color: var(--bad); font-size: 13px; margin-top: 4px; }
.ed-hand .ok { color: var(--good); font-size: 13px; margin-top: 4px; }
.ed-hand .preview { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 6px; }
.seat-list { list-style: none; padding: 0; margin: 8px 0; }
.seat-list li { padding: 8px 10px; background: rgba(0,0,0,.22); border-radius: 10px; margin: 4px 0; display: flex; justify-content: space-between; }
.bigcode { font-size: 40px; letter-spacing: 8px; font-weight: 800; text-align: center; color: var(--accent); margin: 6px 0; }
.rules h3 { color: var(--accent); margin-top: 18px; }
.rules p, .rules li { line-height: 1.45; font-size: 15px; }
</style>

<p>American Mahjong is played with 152 tiles: three suits (Bams, Craks, Dots) numbered 1\u20139, four Winds (N, E, W, S), three Dragons, eight Flowers and eight Jokers. Each suit has its own dragon: <b>Green</b> goes with Bams, <b>Red</b> with Craks and <b>White ("Soap")</b> with Dots. The White Dragon also stands for <b>0</b> in year hands like 2026.</p>
<p>Your goal is to be the first to collect 14 tiles that exactly match one hand on the <b>card</b>. Tap \u{1F4CB} in a game to see the card.</p>

<h3>Reading the card</h3>
<ul>
<li>Each group of identical tiles is shown together: <b>FF</b> is a pair of flowers, <b>222</b> a pung (three), <b>2222</b> a kong (four), <b>22222</b> a quint (five).</li>
<li>Colors show suits. Green, red and blue mean three <i>different</i> suits \u2014 any suits you like, as long as same color = same suit and different colors = different suits. The colors don't mean Bams, Craks or Dots specifically.</li>
<li><b>D</b> is the dragon that matches its color's suit. <b>0</b> is the White Dragon.</li>
<li>Hands marked <b>any</b> numbers can be moved: "11 222 3333" can also be "55 666 7777" \u2014 any run that fits 1\u20139. Like-number hands can use any one number.</li>
<li><b>X</b> = exposed hands: you may call discards to complete groups. <b>C</b> = concealed: you may only call the very last tile, for Mahjong.</li>
<li>The number on the right is the hand's value.</li>
</ul>

<h3>The Charleston</h3>
<p>Before play, everyone trades unwanted tiles. Jokers can never be passed.</p>
<ol>
<li><b>First Charleston</b> (required): pass 3 tiles right, then 3 across, then 3 left.</li>
<li>On the last pass (first left) you may <b>blind pass</b>: pass 1, 2 or all 3 of the tiles you are receiving onward without looking at them, instead of tiles from your hand.</li>
<li><b>Second Charleston</b> (optional): if every player agrees, pass left, across, then right (blind pass allowed on the last). Any one player can stop it.</li>
<li><b>Courtesy pass</b>: you and the player across may trade 0\u20133 tiles. You trade the smaller of the two numbers you each pick.</li>
</ol>

<h3>Play</h3>
<ul>
<li>East (the dealer) starts with 14 tiles and discards first. Play moves to the right.</li>
<li>On your turn you draw a tile, then discard one.</li>
<li><b>Calling</b>: when someone discards, you may call it to complete a pung, kong, quint or sextet. You expose the group face-up on your rack and then discard; play continues from you. Exposures must fit a hand on the card.</li>
<li>You may only call a discard for a <b>pair or single</b> if it gives you Mahjong.</li>
<li>If more than one player wants a tile, Mahjong beats an exposure; otherwise the player next in turn wins.</li>
<li>A discarded Joker can't be called.</li>
</ul>

<h3>Jokers</h3>
<ul>
<li>A Joker can stand in for any tile in a group of 3 or more (pung, kong, quint, sextet) \u2014 including flowers.</li>
<li>Jokers can <b>never</b> be used for a single tile or a pair.</li>
<li><b>Joker swap</b>: on your turn, if any exposed group (anyone's) has a Joker standing for a tile you hold, you may trade your tile for that Joker.</li>
</ul>

<h3>Dead hands</h3>
<p>Your hand is <b>dead</b> if you declare Mahjong with a hand that doesn't match the card, or if your exposures can't fit any hand on the card. A dead hand keeps drawing and discarding but can't call tiles or win, and still pays the winner.</p>

<h3>Winning and scoring</h3>
<ul>
<li>Declare <b>Mahjong</b> when your 14 tiles match a hand \u2014 from a tile you drew or a discard you called.</li>
<li>Won on a discard: the discarder pays double the hand's value and everyone else pays the value.</li>
<li>Self-drawn: everyone pays double.</li>
<li>Jokerless: a hand with no Jokers is worth double (except Pairs hands, which can't use jokers anyway).</li>
<li>If the wall runs out first, it's a <b>wall game</b>: nobody wins or pays.</li>
<li>The deal moves to the right after every hand.</li>
</ul>

<h3>Two-player game</h3>
<p>Two players sit across from each other with no bots. All Charleston passes go across (3 passes, then an optional 3 more); there is no courtesy pass. The loser pays double on a discard win or on a self-drawn win. Everything else is the same.</p>

<h3>About the card</h3>
<p>The built-in <b>Practice Card</b> was made for this app and is not the official National Mah Jongg League card, which changes every year and is copyrighted. If you own an official card, you can type its hands into the <b>Card editor</b> for your own play.</p>
<p>In this app, the computer checks every hand for you. With <b>Assist</b> on (Settings), it only offers calls and Mahjong that are allowed. Turn Assist off for "real table" rules, where a wrong Mahjong call kills your hand.</p>
